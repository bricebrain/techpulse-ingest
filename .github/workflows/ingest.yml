name: TechPulse Ingestion

on:
  schedule:
    - cron: '0 6,12,18 * * *'     # 3x/day at 6h, 12h, 18h UTC
  workflow_dispatch: {}

concurrency:
  group: techpulse-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run ingestion pipeline
        env:
          TECHPULSE_WORKER_URL: ${{ secrets.TECHPULSE_WORKER_URL }}
          TECHPULSE_WORKER_SECRET: ${{ secrets.TECHPULSE_WORKER_SECRET }}
          GITHUB_TRIGGER_TOKEN: ${{ secrets.TRIGGER_TOKEN }}
          INTELLIGENCE_REPO: ${{ secrets.INTELLIGENCE_REPO }}
          TECHPULSE_RENDER_API_URL: ${{ secrets.TECHPULSE_RENDER_API_URL }}
          TECHPULSE_RENDER_API_SECRET: ${{ secrets.TECHPULSE_RENDER_API_SECRET }}
          TECHPULSE_RENDER_EXTRACT_TIMEOUT: "45"
        run: python -m pipeline
