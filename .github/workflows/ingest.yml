name: TechPulse Ingestion

on:
  schedule:
    - cron: '0 6,12,18 * * *'     # 3x/day at 6h, 12h, 18h UTC
  workflow_dispatch: {}             # Manual trigger

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      EMBEDDING_MODEL: BAAI/bge-m3

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-ingest-models-v1-${{ runner.os }}
          restore-keys: |
            hf-ingest-models-v1-

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Preload Hugging Face embedding model
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -m pipeline.hf_preload

      - name: Run ingestion pipeline
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          GITHUB_TRIGGER_TOKEN: ${{ secrets.TRIGGER_TOKEN }}
          INTELLIGENCE_REPO: ${{ secrets.INTELLIGENCE_REPO }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          EMBEDDING_MODEL: BAAI/bge-m3
        run: python -m pipeline
