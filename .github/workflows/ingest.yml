name: TechPulse Ingestion

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 6,12,18 * * *'     # 3x/day at 6h, 12h, 18h UTC
  workflow_dispatch:
    inputs:
      refresh_hf_cache:
        description: 'Download missing BGE-M3 files from Hugging Face and upload them to R2'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: techpulse-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      EMBEDDING_MODEL: BAAI/bge-m3

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-ingest-models-v1-${{ runner.os }}
          restore-keys: |
            hf-ingest-models-v1-

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Preload Hugging Face embedding model
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HUGGINGFACEHUB_API_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_HUB_OFFLINE: ${{ github.event.inputs.refresh_hf_cache == 'true' && '0' || '1' }}
          TECHPULSE_HF_DOWNLOAD_MISSING: ${{ github.event.inputs.refresh_hf_cache == 'true' && 'true' || 'false' }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          HF_R2_BUCKET: ${{ secrets.R2_BUCKET }}
          HF_R2_PREFIX: hf-model-cache/embeddings/v1
        run: python -m pipeline.hf_preload

      - name: Run ingestion pipeline
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          GITHUB_TRIGGER_TOKEN: ${{ secrets.TRIGGER_TOKEN }}
          INTELLIGENCE_REPO: ${{ secrets.INTELLIGENCE_REPO }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HUGGINGFACEHUB_API_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_HUB_OFFLINE: "1"
          EMBEDDING_MODEL: BAAI/bge-m3
          TECHPULSE_RENDER_API_URL: ${{ secrets.TECHPULSE_RENDER_API_URL }}
          TECHPULSE_RENDER_API_SECRET: ${{ secrets.TECHPULSE_RENDER_API_SECRET }}
          TECHPULSE_RENDER_EXTRACT_TIMEOUT: "45"
        run: python -m pipeline
