name: Migrate Neon Article Intelligence

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type APPLY_ARTICLE_INTELLIGENCE to add structured article intelligence"
        required: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Validate confirmation
        run: |
          test "${{ github.event.inputs.confirm }}" = "APPLY_ARTICLE_INTELLIGENCE"

      - name: Install migration dependencies
        run: pip install "psycopg2-binary>=2.9"

      - name: Apply article intelligence migration
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: python -m pipeline.run_sql_file migrations/004_article_intelligence.sql
