name: Migrate Neon Observability

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type APPLY_OBSERVABILITY to add pipeline status and jobs tables"
        required: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Validate confirmation
        run: |
          test "${{ github.event.inputs.confirm }}" = "APPLY_OBSERVABILITY"

      - name: Install migration dependencies
        run: pip install "psycopg2-binary>=2.9"

      - name: Apply observability migration
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: python -m pipeline.run_sql_file migrations/003_pipeline_observability.sql
