name: Migrate Neon Retention Policy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type APPLY_RETENTION to install the prune_techpulse() function + indexes"
        required: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Validate confirmation
        run: |
          test "${{ github.event.inputs.confirm }}" = "APPLY_RETENTION"

      - name: Install migration dependencies
        run: pip install "psycopg2-binary>=2.9"

      - name: Apply retention policy migration
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: python -m pipeline.run_sql_file migrations/007_retention_policy.sql
