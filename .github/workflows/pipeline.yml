name: TechPulse Pipeline

on:
  workflow_dispatch:
    inputs:
      article_llm_limit:
        description: 'Max articles to enrich with Article Intelligence in this run'
        required: false
        default: '60'
        type: string
      force_llm_analysis:
        description: 'Regenerate cluster LLM analyses even if they were analyzed recently'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      cluster_window_hours:
        description: 'Time window (hours) for URL/title/keyword dedup clustering'
        required: false
        default: '72'
        type: string

concurrency:
  group: techpulse-pipeline
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r ingest/requirements.txt

      - name: Run ingestion pipeline
        env:
          TECHPULSE_WORKER_URL: ${{ secrets.TECHPULSE_WORKER_URL }}
          TECHPULSE_WORKER_SECRET: ${{ secrets.TECHPULSE_WORKER_SECRET }}
          TECHPULSE_RENDER_API_URL: ${{ secrets.TECHPULSE_RENDER_API_URL }}
          TECHPULSE_RENDER_API_SECRET: ${{ secrets.TECHPULSE_RENDER_API_SECRET }}
          TECHPULSE_RENDER_EXTRACT_TIMEOUT: "45"
        run: python -m ingest
